<!DOCTYPE html>
<html lang="en-NZ" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password | Pocket Lyrics</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1c1d22">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/site.css?v=20261105">
  <style>
    body { background: var(--pl-charcoal); color: var(--pl-text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
    .reset { flex: none; width: 100%; max-width: 26rem; display: grid; gap: 1.5rem; }
    .reset-brand { display: grid; justify-items: center; gap: 0.6rem; text-align: center; }
    .reset-brand img { width: 60px; height: 60px; border-radius: 16px; }
    .reset-brand strong { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
    .reset-card { background: var(--pl-charcoal-2); border: 1px solid rgba(243, 241, 250, 0.12); border-radius: 18px; padding: 1.5rem; display: grid; gap: 1.1rem; }
    .reset-card[hidden] { display: none; }
    .reset-card h1 { margin: 0; font-family: var(--font-display); font-size: 1.4rem; color: var(--pl-text); }
    .reset-card p { color: var(--pl-muted); overflow-wrap: anywhere; }
    .reset-card p a { color: var(--pl-lavender); }
    form { display: grid; gap: 1.1rem; margin: 0; }
    .field { display: grid; gap: 0.5rem; }
    .field label { font-size: 0.85rem; font-weight: 600; color: var(--pl-muted); }
    .field-box { position: relative; }
    .field input { width: 100%; box-sizing: border-box; min-height: 50px; padding: 0.75rem 3.25rem 0.75rem 1rem; font: inherit; font-size: 16px; color: var(--pl-text); background: var(--pl-charcoal); border: 1.5px solid rgba(243, 241, 250, 0.2); border-radius: 12px; }
    .field input:focus { outline: none; border-color: var(--pl-lavender); }
    .field input[aria-invalid="true"] { border-color: #f4a79a; }
    .eye { position: absolute; top: 3px; right: 3px; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 50%; color: var(--pl-text); cursor: pointer; }
    .eye:hover { background: rgba(243, 241, 250, 0.08); }
    .eye:focus-visible { outline: 2px solid var(--pl-lavender); outline-offset: -2px; }
    .eye svg { width: 22px; height: 22px; }
    .eye .eye-off, .eye[aria-pressed="true"] .eye-on { display: none; }
    .eye[aria-pressed="true"] .eye-off { display: block; }
    .hint { font-size: 0.85rem; color: var(--pl-muted); }
    .error { font-size: 0.85rem; color: #f4a79a; }
    .submit { min-height: 56px; font: inherit; font-weight: 600; color: var(--pl-charcoal); background: var(--pl-lavender); border: 0; border-radius: 12px; cursor: pointer; }
    .submit:hover { filter: brightness(1.05); }
    .submit:focus-visible { outline: 2px solid var(--pl-text); outline-offset: 2px; }
    .submit[disabled] { opacity: 0.6; cursor: default; }
    .reset-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem 0.75rem; text-align: center; font-size: 0.85rem; color: var(--pl-muted); }
    .reset-foot a { color: var(--pl-muted); }
  </style>
</head>
<body>
  <main class="reset">
    <div class="reset-brand">
      <img src="/assets/pocket-lyrics-icon-192.png" alt="" width="60" height="60">
      <strong>Pocket Lyrics</strong>
    </div>

    <section class="reset-card" id="checking" aria-live="polite">
      <p>Checking your link…</p>
    </section>

    <section class="reset-card" id="choose" hidden>
      <h1>Choose a new password</h1>
      <p id="for-email" hidden></p>
      <form id="form" novalidate>
        <input id="username" type="email" autocomplete="username" hidden>
        <div class="field">
          <label for="password">New password</label>
          <div class="field-box">
            <input id="password" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false" aria-describedby="password-note">
            <button class="eye" id="eye" type="button" aria-pressed="false" aria-label="Show password">
              <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.5 17.5 0 0 1-3.2 4.1M6.6 6.6C3.6 8.5 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
            </button>
          </div>
          <div id="password-note" class="hint" role="status">At least 8 characters</div>
        </div>
        <button class="submit" id="submit" type="submit">Save new password</button>
      </form>
    </section>

    <section class="reset-card" id="done" hidden>
      <h1 tabindex="-1">Your password has been changed</h1>
      <p>Return to the Pocket Lyrics app and sign in with your new password.</p>
    </section>

    <section class="reset-card" id="problem" hidden>
      <h1 id="problem-title" tabindex="-1"></h1>
      <p id="problem-text"></p>
      <p>Need a hand? Email <a href="mailto:support@goodmarklabs.com">support@goodmarklabs.com</a>.</p>
    </section>

    <noscript><p class="reset-foot">This page needs JavaScript to reset your password.</p></noscript>

    <p class="reset-foot"><span>Goodmark Labs (Goodmark Limited, New Zealand)</span><a href="/pocket-lyrics/privacy/">Privacy Policy</a></p>
  </main>

  <script>
  /* Firebase's password reset, with no third-party scripts. The one-time code and API key come from
     the emailed link, so nothing secret is stored here. The password goes only to Firebase. */
  (function () {
    var MIN_LENGTH = 8;
    var ENDPOINT = 'https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=';
    var query = new URLSearchParams(location.search);
    var mode = query.get('mode');
    var code = query.get('oobCode');
    var apiKey = query.get('apiKey');

    var $ = function (id) { return document.getElementById(id); };
    var sections = ['checking', 'choose', 'done', 'problem'];
    var show = function (id) {
      sections.forEach(function (name) { $(name).hidden = name !== id; });
    };
    /** The link can't be used again, so it comes out of the address bar and browser history. */
    var forgetLink = function () {
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    };
    var fail = function (title, text) {
      $('problem-title').textContent = title;
      $('problem-text').textContent = text;
      show('problem');
      $('problem-title').focus();
    };
    var linkUsedUp = function () {
      forgetLink();
      fail('This link has expired', "It may already have been used. In Pocket Lyrics, tap Forgot password on the sign-in screen and we'll email you a new one.");
    };

    var call = function (body) {
      return fetch(ENDPOINT + encodeURIComponent(apiKey), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        referrerPolicy: 'no-referrer'
      }).then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (response.ok) return data;
          var message = data && data.error && data.error.message ? String(data.error.message) : '';
          var error = new Error(message);
          error.reason = message.split(/[ :]/)[0];
          throw error;
        });
      });
    };

    var isLinkProblem = function (reason) {
      return reason === 'EXPIRED_OOB_CODE' || reason === 'INVALID_OOB_CODE';
    };

    var note = $('password-note');
    var input = $('password');
    var setNote = function (text, isError) {
      note.textContent = text;
      note.className = isError ? 'error' : 'hint';
      if (isError) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    };

    $('eye').addEventListener('click', function () {
      var visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      this.setAttribute('aria-pressed', String(visible));
      this.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      input.focus();
    });

    input.addEventListener('input', function () {
      setNote('At least ' + MIN_LENGTH + ' characters', false);
    });

    $('form').addEventListener('submit', function (event) {
      event.preventDefault();
      if (input.value === '') return setNote('Enter a new password.', true);
      if (input.value.length < MIN_LENGTH) return setNote('Choose a password with at least ' + MIN_LENGTH + ' characters.', true);
      var submit = $('submit');
      submit.disabled = true;
      submit.textContent = 'Saving…';
      call({ oobCode: code, newPassword: input.value }).then(function () {
        input.value = '';
        forgetLink();
        show('done');
        document.querySelector('#done h1').focus();
      }).catch(function (error) {
        submit.disabled = false;
        submit.textContent = 'Save new password';
        if (isLinkProblem(error.reason)) return linkUsedUp();
        if (error.reason === 'WEAK_PASSWORD') return setNote('That password is too easy to guess. Try a longer one.', true);
        if (error.reason === 'USER_DISABLED') return fail('This account has been turned off', 'Please contact us if you think this is a mistake.');
        if (error.reason === 'USER_NOT_FOUND') return fail('We can’t find this account', 'It may have been deleted.');
        if (error.reason === 'TOO_MANY_ATTEMPTS_TRY_LATER') return setNote('Too many attempts. Wait a few minutes and try again.', true);
        if (error.reason === undefined) return setNote("Can't reach the internet. Check your connection and try again.", true);
        setNote('Something went wrong. Please try again.', true);
      });
    });

    if (mode && mode !== 'resetPassword') {
      return fail('This link can’t be used here', 'This page only resets passwords. Please contact us and we’ll sort it out.');
    }
    if (!code || !apiKey) {
      return fail('This link isn’t complete', "Open the link from your password reset email. In Pocket Lyrics, tap Forgot password on the sign-in screen and we'll email you a new one.");
    }

    call({ oobCode: code }).then(function (data) {
      if (data.email) {
        $('for-email').textContent = 'For ' + data.email;
        $('for-email').hidden = false;
        $('username').value = data.email;
      }
      show('choose');
      input.focus();
    }).catch(function (error) {
      if (isLinkProblem(error.reason)) return linkUsedUp();
      if (error.reason === undefined) return fail("Can't reach the internet", 'Check your connection, then open the link in your email again.');
      fail('Something went wrong', 'Please open the link in your email again.');
    });
  })();
  </script>
</body>
</html>
